[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-add"
version = "0.3.0"
authors = [
  {name="Minqi Jiang", email="msj@meta.com"},
]
description = "Minimax UED framework + ADD (Adversarial Diffusion Design) in JAX"
readme = "README.md"
license = {text = "Apache 2.0"}
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = [
  "numpy>=1.25",
  "pandas>=1.5.3",
  "jax>=0.4.31",
  "jaxlib>=0.4.31",
  "flax>=0.7.4",
  "optax>=0.1.7",
  "distrax>=0.1.8",
  "chex>=0.1.83",
  "wandb>=0.13",
  "tqdm>=4.66.1",
]

[tool.setuptools.package-data]
"minimax.config.configs" = ["**"]
